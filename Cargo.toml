[package]
name = "tor-browser-builder"
version = "0.2.0"
edition = "2021"
build = "src/build.rs"
[dependencies]
eframe = "0.32"
egui = "0.32"
egui_extras = { version = "0.32", features = ["all_loaders"] }
directories = "5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
sequoia-openpgp = { version = "2.4", default-features = false, features = ["crypto-openssl"] }
openssl = { version = "0.10", features = ["vendored"] }
anyhow = "1"
zeroize = "1"
url = "2"

[profile.release]
opt-level = 3
lto = true
strip = true

[build-dependencies]
icns = "0.4.0"
resvg = "0.48.1"
tiny-skia = "0.12.0"
usvg = "0.48.1"
